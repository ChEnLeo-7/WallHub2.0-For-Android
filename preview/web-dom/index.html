<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="wallhub-source" content="{{SOURCE_HASH}}">
  <title>WallHub Web Preview</title>
  <script>
    try {
      const persisted = JSON.parse(localStorage.getItem('wallhub.preview.fake-backend') || 'null');
      const preference = persisted?.settings?.themePreference || 'SYSTEM';
      const light = preference === 'LIGHT' || (preference === 'SYSTEM' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    } catch {}
    const width = Math.round(window.visualViewport?.width ?? window.innerWidth);
    document.documentElement.dataset.windowClass =
      width < {{MEDIUM_BREAKPOINT}}
        ? 'compact'
        : width < {{EXPANDED_BREAKPOINT}} ? 'medium' : 'expanded';
  </script>
  <link rel="stylesheet" href="{{STYLESHEET}}">
  <script type="module" src="{{SCRIPT}}"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
