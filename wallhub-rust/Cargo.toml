[package]
name = "wallhub-rust"
version = "0.1.0"
edition = "2021"
description = "WallHub Rust core: depot verification, decompression and chunk crypto for the kSteam + Rust hybrid architecture."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
adler2 = "2.0"
aes = "0.8"
lz4_flex = "0.11"
ruzstd = "0.7"

[dev-dependencies]
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
