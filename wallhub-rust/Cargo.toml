[package]
name = "wallhub-rust"
version = "0.1.0"
edition = "2021"
description = "WallHub Rust core: depot verification, decompression, chunk crypto and network download for the kSteam + Rust hybrid architecture."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
adler2 = "2.0"
aes = "0.8"
jni = "0.21"
lz4_flex = "0.11"
lzma-rs = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
ruzstd = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"] }

[dev-dependencies]
sha1 = "0.10"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
