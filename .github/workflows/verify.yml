name: Android CI

# What this workflow can and cannot verify.
#
# The app module compiles against the Steam Content SDK's Android preview AAR, which is a local, gitignored
# artifact staged from the sibling SDK repository (`sc-sdk-maven/`, see `settings.gradle.kts`). No package is
# published anywhere, and mavenLocal() is deliberately not a fallback, so a hosted runner cannot resolve it or build/unit-test `:app`. The APK is
# built on the LAN build worker instead (`/usr/local/bin/request-android-release-build`), which is also where
# the device-verified artifacts come from.
#
# This workflow therefore checks the parts that need no AAR: the app-owned ETC2 native module cross-compiles
# for every shipped ABI, and the removed Steam backends stay removed.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-boundaries:
    # This job intentionally never resolves/builds :app; settings uses this explicit source-only opt-out.
    env:
      WALLHUB_SOURCE_ONLY_CI: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the hosted Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install the NDK
        run: sdkmanager "ndk;27.0.12077973" >/dev/null
      - name: Build the app-owned ETC2 encoder for every ABI
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-etc2.sh
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "app/src/main/jniLibs/$abi/libwallhub_etc2.so"
            # Exactly one exported symbol: the JNI entry point the Kotlin boundary names.
            count="$(readelf --dyn-syms --wide "app/src/main/jniLibs/$abi/libwallhub_etc2.so" \
              | awk '$4 == "FUNC" && $7 != "UND" { n++ } END { print n + 0 }')"
            test "$count" -eq 1
          done
      - name: Verify debug command and SDK artifact boundaries
        run: |
          python3 scripts/check-debug-command-boundary.py
          python3 scripts/test-sdk-artifact-lock.py
          python3 scripts/sdk-artifact-lock.py verify
          ! grep -q 'mavenLocal()' settings.gradle.kts
      - name: The removed Steam backends stay removed
        run: |
          set -e
          # No kSteam dependency or source, no product-local Rust depot core, no Rust build step. The prose
          # comments that record what was removed are not matched: only code-level markers are.
          ! grep -rIn --exclude-dir=.git \
            --include='*.kt' --include='*.kts' --include='*.toml' --include='*.properties' \
            -e 'bruhcollective.itaysonlab.ksteam' -e 'libwallhub_rust' -e 'WallHubRust' \
            -e 'RustDepotDownloader' -e 'KSteamSessionRepository' .
          ! test -d wallhub-rust
          ! test -f scripts/build-rust.sh
          ! test -f app/src/main/kotlin/com/wallhub/android/data/downloads/SteamContentTransfer.kt
          ! test -f app/src/main/kotlin/com/wallhub/android/data/downloads/SteamContentDownloader.kt
          ! test -f app/src/main/kotlin/com/wallhub/android/data/steam/UnifiedWorkshopBrowse.kt
          # The depot and range paths answer from the SDK, so nothing selects a backend at build time. Only
          # code and build files are searched, so this workflow and the historical docs cannot match.
          ! grep -rIn --exclude-dir=.git \
            --include='*.kt' --include='*.kts' --include='*.toml' --include='*.properties' \
            -e 'wallhub.useSdk' -e 'BuildConfig.USE_SDK' .
          # The SDK AAR is the only Steam backend the app links against.
          grep -q 'io.steamcontent.sdk:sc-content-android-preview' app/build.gradle.kts
