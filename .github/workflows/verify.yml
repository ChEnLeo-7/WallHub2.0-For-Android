name: Android CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" >/dev/null
      - name: Build Rust depot core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-rust.sh
      - name: Build kSteam into Maven Local
        env:
          KSTEAM_PINNED_SHA: e751f788670a973aed2c4304adc983fafe14c260
        run: |
          git clone --depth 1 https://github.com/iTaysonLab/kSteam.git /tmp/ksteam
          cd /tmp/ksteam
          if [[ "$(git rev-parse HEAD)" != "$KSTEAM_PINNED_SHA" ]]; then
            git fetch --depth 1 origin "$KSTEAM_PINNED_SHA"
            git checkout --quiet FETCH_HEAD
          fi
          test "$(git rev-parse HEAD)" = "$KSTEAM_PINNED_SHA"
          git submodule update --init --depth 1
          yes | sdkmanager --licenses >/dev/null || true
          chmod +x gradlew
          # Regenerate the vendored Wire protos from the pinned Protobufs submodule:
          # kSteam r50's committed proto tree is inconsistent with its own submodule pin.
          ./gradlew --no-daemon :proto-common:upgradeProtoFiles
          # Prune fringe services whose types live outside kSteam's webui-only proto
          # pipeline (SteamDatabase layout drift); nothing else references them.
          rm -f proto-common/src/commonMain/proto/webui/service_accountscore.proto \
                proto-common/src/commonMain/proto/webui/service_steamgpt*.proto
          ./gradlew --no-daemon publishToMavenLocal
      - name: Generate reviewed Detekt baseline
        run: |
          chmod +x gradlew
          workers="$(nproc)"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" \
            :app:detektBaseline
      - name: Verify Android application
        run: |
          workers="$(nproc)"
          printf 'Gradle workers: %s\n' "$workers"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" \
            :app:testDebugUnitTest \
            :app:verifyLintSourceWarningBudget \
            detekt \
            ktlintCheck \
            dependencyUpdates \
            :app:assembleDebug
      - name: Require Release signing secrets
        if: github.event_name != 'pull_request'
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in \
            WALLHUB_RELEASE_KEYSTORE_BASE64 \
            WALLHUB_RELEASE_STORE_PASSWORD \
            WALLHUB_RELEASE_KEY_ALIAS \
            WALLHUB_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore Release signing keystore
        if: github.event_name != 'pull_request'
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
        run: |
          printf '%s' "$WALLHUB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WALLHUB_RELEASE_STORE_FILE"
          test -s "$WALLHUB_RELEASE_STORE_FILE"
          chmod 600 "$WALLHUB_RELEASE_STORE_FILE"
      - name: Assemble signed Release APK
        if: github.event_name != 'pull_request'
        env:
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          workers="$(nproc)"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" \
            :app:assembleRelease \
            -Pwallhub.requireReleaseSigning=true
      - name: Verify Release APK size
        if: github.event_name != 'pull_request'
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          release_certificate="$($apksigner verify --print-certs "$apk_path" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')"
          release_subject="$($apksigner verify --print-certs "$apk_path" | awk -F': ' '/Signer #1 certificate DN:/{print $2; exit}')"
          debug_certificate="$($apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')"
          expected_release_certificate="$(tr -d '[:space:]' < config/release-signing-certificate.sha256 | tr '[:lower:]' '[:upper:]')"
          test -n "$release_certificate" -a -n "$release_subject" -a -n "$debug_certificate"
          [[ "$expected_release_certificate" =~ ^[0-9A-F]{64}$ ]]
          [[ "$release_certificate" == "$expected_release_certificate" ]] || {
            echo "::error::Release APK does not match the pinned published signing identity"
            exit 1
          }
          if grep -Eiq '(^|,[[:space:]]*)CN=Android Debug(,|$)' <<<"$release_subject"; then
            echo "::warning::Pinned legacy Release identity uses Android Debug DN; rotate only with an Android signing lineage"
          fi
          [[ "$release_certificate" != "$debug_certificate" ]] || {
            echo "::error::Release APK is signed with the Android Debug certificate"
            exit 1
          }
          printf 'Release certificate subject: %s\n' "$release_subject"
          printf 'Release certificate SHA-256: %s\n' "$release_certificate"
          apk_size="$(stat --format='%s' "$apk_path")"
          max_size="$((40 * 1024 * 1024))"
          printf 'Release APK size: %s bytes (limit: %s bytes)\n' "$apk_size" "$max_size"
          if [ "$apk_size" -gt "$max_size" ]; then
            echo "::error::Release APK exceeds the 40 MiB size budget"
            exit 1
          fi
      - name: Package Release APK artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/wallhub-release.apk
          (
            cd artifact
            sha256sum wallhub-release.apk > wallhub-release.apk.sha256
          )
          printf '%s\n' "$GITHUB_SHA" > artifact/commit-sha.txt
      - name: Upload signed Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wallhub-release-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
