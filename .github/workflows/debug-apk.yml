name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" >/dev/null
      - name: Build Rust depot core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-rust.sh
      - name: Build kSteam into Maven Local
        env:
          KSTEAM_PINNED_SHA: e751f788670a973aed2c4304adc983fafe14c260
        run: |
          git clone --depth 1 https://github.com/iTaysonLab/kSteam.git /tmp/ksteam
          cd /tmp/ksteam
          if [[ "$(git rev-parse HEAD)" != "$KSTEAM_PINNED_SHA" ]]; then
            git fetch --depth 1 origin "$KSTEAM_PINNED_SHA"
            git checkout --quiet FETCH_HEAD
          fi
          test "$(git rev-parse HEAD)" = "$KSTEAM_PINNED_SHA"
          git submodule update --init --depth 1
          yes | sdkmanager --licenses >/dev/null || true
          chmod +x gradlew
          # Regenerate the vendored Wire protos from the pinned Protobufs submodule:
          # kSteam r50's committed proto tree is inconsistent with its own submodule pin.
          ./gradlew --no-daemon :proto-common:upgradeProtoFiles
          # SteamDatabase layout drift: some vendored webui protos reference types defined
          # outside kSteam's webui-only pipeline. Generate root-scope stub messages for
          # every unresolvable reference so Wire codegen (and kSteam's hand-written
          # SteamGrpcClients, which touches every service) stays intact.
          python3 - <<'PYSTUB'
          import os, re
          root = "proto-common/src/commonMain/proto"
          files = [os.path.join(dp, f) for dp, _, fs in os.walk(root) for f in fs if f.endswith(".proto")]
          defined = set()
          for p in files:
              with open(p, encoding="utf-8", errors="ignore") as handle:
                  defined |= set(re.findall(r"^\s*(?:message|enum)\s+([A-Za-z][A-Za-z0-9_]*)", handle.read(), re.M))
          missing = set()
          for p in files:
              with open(p, encoding="utf-8", errors="ignore") as handle:
                  body = re.sub(r"^\s*(?:message|enum|service|extend)\s+([A-Za-z][A-Za-z0-9_]*)", "", handle.read(), flags=re.M)
              for reference in re.findall(r"\.\s*([A-Za-z][A-Za-z0-9_]*)\b", body):
                  if reference not in defined and not reference.startswith(("google", "steam")):
                      missing.add(reference)
          stubs = sorted(missing)
          out = os.path.join(root, "webui", "zz_ci_stubs.proto")
          with open(out, "w", encoding="utf-8") as handle:
              handle.write("// CI-generated stubs for SteamDatabase types outside kSteam's webui pipeline.\n")
              handle.write('syntax = "proto2";\n\n')
              for name in stubs:
                  handle.write("message %s {}\n" % name)
          print("stubbed %d missing proto types -> %s" % (len(stubs), out))
          files = [os.path.join(dp, f) for dp, _, fs in os.walk(root) for f in fs if f.endswith(".proto")]
          owner = {}
          for p in files:
              with open(p, encoding="utf-8", errors="ignore") as handle:
                  for name in re.findall(r"^\s*(?:message|enum)\s+([A-Za-z][A-Za-z0-9_]*)", handle.read(), re.M):
                      owner.setdefault(name, p)
          repaired = 0
          for p in files:
              with open(p, encoding="utf-8", errors="ignore") as handle:
                  text2 = handle.read()
              body = re.sub(r"^\s*(?:message|enum|service|extend)\s+([A-Za-z][A-Za-z0-9_]*)", "", text2, flags=re.M)
              needed = set()
              for reference in re.findall(r"\.\s*([A-Za-z][A-Za-z0-9_]*)\b", body):
                  target = owner.get(reference)
                  if target is not None and target != p:
                      needed.add(os.path.relpath(target, root).replace(os.sep, "/"))
              existing = set(re.findall(r'import\s+"([^"]+)"', text2))
              to_add = sorted(needed - existing)
              if not to_add:
                  continue
              lines = text2.splitlines(keepends=True)
              insert_at = next((index + 1 for index, line in enumerate(lines) if line.startswith("syntax")), 0)
              lines[insert_at:insert_at] = ['import "%s";\n' % path2 for path2 in to_add]
              with open(p, "w", encoding="utf-8") as handle:
                  handle.writelines(lines)
              repaired += len(to_add)
          print("repaired %d missing proto imports" % repaired)
          PYSTUB
          ./gradlew --no-daemon publishToMavenLocal
      - name: Require Release signing secrets
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in \
            WALLHUB_RELEASE_KEYSTORE_BASE64 \
            WALLHUB_RELEASE_STORE_PASSWORD \
            WALLHUB_RELEASE_KEY_ALIAS \
            WALLHUB_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore Release signing keystore
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
        run: |
          printf '%s' "$WALLHUB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WALLHUB_RELEASE_STORE_FILE"
          test -s "$WALLHUB_RELEASE_STORE_FILE"
          chmod 600 "$WALLHUB_RELEASE_STORE_FILE"
      - name: Assemble Debug APK
        env:
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          workers="$(nproc)"
          printf 'Gradle workers: %s\n' "$workers"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$WALLHUB_RELEASE_STORE_FILE" \
            --ks-pass env:WALLHUB_RELEASE_STORE_PASSWORD \
            --ks-key-alias "$WALLHUB_RELEASE_KEY_ALIAS" \
            --key-pass env:WALLHUB_RELEASE_KEY_PASSWORD \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Package Debug APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/wallhub-debug.apk
          (
            cd artifact
            sha256sum wallhub-debug.apk > wallhub-debug.apk.sha256
          )
          printf '%s\n' "$GITHUB_SHA" > artifact/commit-sha.txt
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallhub-debug-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 3
