name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" >/dev/null
      - name: Build Rust depot core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-rust.sh
      - name: Require Release signing secrets
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in \
            WALLHUB_RELEASE_KEYSTORE_BASE64 \
            WALLHUB_RELEASE_STORE_PASSWORD \
            WALLHUB_RELEASE_KEY_ALIAS \
            WALLHUB_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore Release signing keystore
        env:
          WALLHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.WALLHUB_RELEASE_KEYSTORE_BASE64 }}
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
        run: |
          printf '%s' "$WALLHUB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WALLHUB_RELEASE_STORE_FILE"
          test -s "$WALLHUB_RELEASE_STORE_FILE"
          chmod 600 "$WALLHUB_RELEASE_STORE_FILE"
      - name: Assemble Debug APK
        env:
          WALLHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/wallhub-release.keystore
          WALLHUB_RELEASE_STORE_PASSWORD: ${{ secrets.WALLHUB_RELEASE_STORE_PASSWORD }}
          WALLHUB_RELEASE_KEY_ALIAS: ${{ secrets.WALLHUB_RELEASE_KEY_ALIAS }}
          WALLHUB_RELEASE_KEY_PASSWORD: ${{ secrets.WALLHUB_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          workers="$(nproc)"
          printf 'Gradle workers: %s\n' "$workers"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$WALLHUB_RELEASE_STORE_FILE" \
            --ks-pass env:WALLHUB_RELEASE_STORE_PASSWORD \
            --ks-key-alias "$WALLHUB_RELEASE_KEY_ALIAS" \
            --key-pass env:WALLHUB_RELEASE_KEY_PASSWORD \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Package Debug APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/wallhub-debug.apk
          (
            cd artifact
            sha256sum wallhub-debug.apk > wallhub-debug.apk.sha256
          )
          printf '%s\n' "$GITHUB_SHA" > artifact/commit-sha.txt
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallhub-debug-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 3
