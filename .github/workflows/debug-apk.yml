name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Assemble Debug APK
        run: |
          chmod +x gradlew
          workers="$(nproc)"
          printf 'Gradle workers: %s\n' "$workers"
          ./gradlew --no-daemon --parallel --build-cache --max-workers="$workers" :app:assembleDebug
      - name: Package Debug APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/wallhub-debug.apk
          (
            cd artifact
            sha256sum wallhub-debug.apk > wallhub-debug.apk.sha256
          )
          printf '%s\n' "$GITHUB_SHA" > artifact/commit-sha.txt
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallhub-debug-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 3
